<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte al Cliente - Alexandra's Communication</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f4; color: #333; margin: 0; padding: 40px 20px; }
        .soporte-container { max-width: 700px; background: white; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-top: 8px solid #1b5e20; }
        h1 { color: #1b5e20; text-align: center; }
        .info-contacto { background: #e8f5e9; padding: 20px; border-radius: 8px; margin-bottom: 25px; border-left: 6px solid #1b5e20; }
        .canal { margin-bottom: 10px; font-size: 1.1em; }
        .label { font-weight: bold; color: #1b5e20; }
        input, textarea { width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background-color: #2e7d32; color: white; padding: 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 1.1em; font-weight: bold; }
        button:hover { background-color: #1b5e20; }
        .regresar { display: block; text-align: center; margin-top: 25px; text-decoration: none; color: #1b5e20; font-weight: bold; }
    </style>
</head>
<body>

<div class="soporte-container">
    <h1>Atención Ciudadana</h1>
    <p style="text-align: center;">Alexandra's Communication - Paraíso, Tabasco</p>

    <div class="info-contacto">
        <div class="canal"><span class="label"> Correo de Soporte:</span> alexandras.communication@gmail.com</div>
        <div class="canal"><span class="label"> Horario:</span> Lunes - Viernes (8:00 AM - 6:00 PM)</div>
    </div>

    <!-- Se agregó "onsubmit" para validar y el botón ahora es tipo submit -->
    <form onsubmit="validarEnvio(event)">
        <label class="label">Nombre completo</label>
        <input type="text" id="nombre" placeholder="Tu nombre" required>

        <label class="label">Correo electrónico</label>
        <input type="email" id="email" placeholder="tu@correo.com" required>

        <label class="label">Descripción del problema</label>
        <textarea id="mensaje" rows="4" placeholder="¿En qué podemos ayudarte?" required></textarea>

        <button type="submit">Enviar mensaje de soporte</button>
    </form>

    <a href="index.html" class="regresar">← Volver al Portal de Noticias</a>
</div>

<script>
    function validarEnvio(event) {
        event.preventDefault(); // Evita que la página se recargue
        alert('Gracias. Tu mensaje ha sido enviado al equipo de soporte de Alexandra\'s Communication en Paraíso.');
        // Aquí podrías limpiar el formulario si quisieras
        event.target.reset();
    }
</script>

</body>
</html>
