<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Alexandra's Communication</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f4; padding: 20px; }
        .box { max-width: 400px; background: white; margin: 50px auto; padding: 30px; border-radius: 10px; border-top: 8px solid #1b5e20; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; background: #2e7d32; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="color: #1b5e20; text-align: center;">Crear Cuenta Ciudadana</h2>
        <form onsubmit="alert('¡Registro exitoso! Ya puedes iniciar sesión.'); window.location.href='login.html'; event.preventDefault();">
            <label>Nombre Completo</label>
            <input type="text" required>
            <label>Correo Electrónico</label>
            <input type="email" required>
            <label>Crea una Contraseña</label>
            <input type="password" required>
            <button type="submit">Registrarme</button>
        </form>
        <p style="text-align: center;"><a href="login.html" style="color: #1b5e20;">Ya tengo cuenta</a></p>
    </div>
</body>
</html>
