<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Alexandra's Communication</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; border-top: 10px solid #1b5e20; }
        h1 { color: #1b5e20; text-align: center; margin-bottom: 10px; font-size: 1.8em; }
        p { text-align: center; color: #666; margin-bottom: 30px; font-size: 0.9em; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #1b5e20; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 1em; }
        .btn-login { width: 100%; background-color: #2e7d32; color: white; padding: 14px; border: none; border-radius: 5px; cursor: pointer; font-size: 1.1em; font-weight: bold; }
        .btn-login:hover { background-color: #1b5e20; }
        .opciones-extra { display: flex; justify-content: space-between; margin-top: 15px; font-size: 0.85em; }
        .opciones-extra a { color: #1b5e20; text-decoration: none; }
        .regresar { display: block; text-align: center; margin-top: 30px; text-decoration: none; color: #888; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>Bienvenido</h1>
        <p>Portal de Noticias - Alexandra's Communication</p>
        
        <form onsubmit="validarAcceso(event)">
            <label>Correo electrónico o Usuario</label>
            <input type="text" id="usuario" placeholder="usuario@correo.com" required>

            <label>Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required>

            <button type="submit" class="btn-login">Ingresar al Portal</button>
        </form>

        <div class="opciones-extra">
            <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
            <a href="registrarse.html">Registrarse</a>
        </div>

        <a href="index.html" class="regresar">← Volver al Inicio</a>
    </div>

    <script>
        function validarAcceso(event) {
            event.preventDefault();
            const user = document.getElementById('usuario').value;
            // Simulación de acceso
            alert('Iniciando sesión para: ' + user + '. Bienvenido al sistema de Alexandra\'s Communication.');
            window.location.href = "index.html"; // Te redirige al inicio tras loguear
        }
    </script>

</body>
</html>
